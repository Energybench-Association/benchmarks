name: Validate

# Checks every benchmark against STAC and EnergyBench's rules, and that each
# pinned plant exists in the public catalog. Runs on every pull request.
# It only reads this repository and the public STAC API, so it needs no
# secrets and runs the same way for pull requests from forks and from the
# submission bot.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  validate:
    name: Validate benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate
        run: uv run --locked --no-default-groups scripts/validate.py
