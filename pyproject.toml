[project]
name = "energybench-benchmarks"
version = "0.0.0"
description = "Community benchmarks for EnergyBench, with the checks that run before they are published."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# What scripts/validate.py needs.
dependencies = ["httpx>=0.28", "pystac[validation]>=1.15"]

[project.urls]
Homepage = "https://www.energybench.org/benchmarks"
Repository = "https://github.com/Energybench-Association/benchmarks"
Issues = "https://github.com/Energybench-Association/benchmarks/issues"

[dependency-groups]
tests = ["pytest>=9.2"]
typing = ["pyrefly>=1.4"]
lint = ["prek>=0.5.5", "ruff>=0.17.1"]
dev = [
    { include-group = "tests" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[tool.uv]
# The repository holds data and a script, not a package.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88
# The tests import scripts/validate.py by name.
src = [".", "scripts"]

[tool.ruff.lint]
# N naming, E/F errors, D docstrings, I import order, UP modern syntax,
# B likely bugs, ANN type hints, SIM/C4 simpler code, PT pytest style and
# RUF ruff's own checks.
select = ["N", "E4", "E7", "E9", "F", "D", "I", "UP", "B", "ANN", "SIM", "C4", "PT", "RUF"]
extend-select = [
    "D417", # every argument documented in Args
    "D419", # no empty docstrings
]
ignore = [
    "D100", # module docstrings are optional
    "D104", # package docstrings are optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.default]
# Comments, docstrings and docs use American English.
locale = "en-us"

[tool.typos.files]
# Benchmarks hold plant names and descriptions in many languages.
extend-exclude = ["*.lock", "benchmarks/"]

[tool.pyrefly]
project-includes = ["scripts", "tests"]
# The tests import scripts/validate.py by name.
search-path = ["scripts"]
python-version = "3.12"
preset = "strict"

[tool.pytest]
minversion = "9.2"
strict = true
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = ["network: needs internet access (fetches STAC JSON schemas)"]
